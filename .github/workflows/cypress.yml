name: Cypress Tests - Swag Labs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  #  interfaz de GitHub
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          #cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Acción oficial de Cypress que gestiona la instalación, caché y ejecución
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          browser: chrome

      # Guarda evidencias (pantallazos y videos) si hay fallos
      - name: Upload Cypress Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidence
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 5